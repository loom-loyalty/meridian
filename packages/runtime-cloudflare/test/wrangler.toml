# Test-only wrangler config. Points at `test/test-worker.ts` which
# re-exports the DO classes for Miniflare to boot. The adopter-facing
# template lives at `../wrangler.toml.example`.

name = "meridian-runtime-cloudflare-test"
main = "./test-worker.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AGENT"
class_name = "AgentDurableObject"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RegistryDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentDurableObject", "RegistryDurableObject"]

# Workers Observability — matches `wrangler-ci.toml` so local
# `wrangler dev` with `--remote` behaves the same as CI when it
# comes to log retention + dashboard visibility.
[observability]
enabled = true
head_sampling_rate = 1.0
