name: E2E (Cloudflare)

# Deploys `runtime-cloudflare/test/test-worker.ts` to a real Cloudflare
# account, runs a smoke check against the live endpoint, then tears down.
# Skips gracefully until CLOUDFLARE_API_TOKEN is set in repo secrets, so
# this workflow is safe to merge before the CF-side setup is complete.
#
# All inputs come from repo secrets or step outputs this workflow
# generates itself; no user-controlled event payloads flow into `run:`
# commands. See the security notes in DEPLOY-CI.md.
#
# Once the eng-review decision from /plan-eng-review lands in M2
# (real-CF conformance scenarios), this workflow grows to invoke the
# conformance suite against the live deploy instead of the current
# smoke-only check.

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  # One live deploy at a time across all triggers. The worker name is
  # fixed, so parallel deploys would clobber each other's state.
  group: e2e-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Check CF secrets
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    # Block the label-trigger path for forks: only PRs whose HEAD repo
    # matches the main repo can run the deploy. A fork contributor who
    # can apply the `e2e-cloudflare` label otherwise gets to execute
    # arbitrary worker code with the repo's CF secrets. `push` and
    # `workflow_dispatch` aren't fork-reachable, so they stay allowed.
    if: |
      (github.event_name != 'pull_request') ||
      (contains(github.event.pull_request.labels.*.name, 'e2e-cloudflare') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set; skipping real-CF E2E. See packages/runtime-cloudflare/DEPLOY-CI.md."
          fi

  e2e:
    name: Deploy + smoke + teardown
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: meridian-runtime-cloudflare-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime-cloudflare (+ workspace deps)
        # Turbo filter with leading `...` resolves + builds workspace
        # dependencies first (meridian-types, etc.), not just the one
        # package. Without this, `tsc` inside runtime-cloudflare fails
        # because `meridian-types/dist` hasn't been produced yet.
        run: pnpm turbo build --filter=...@loom-loyalty/meridian-runtime-cloudflare

      - name: Deploy test worker to Cloudflare
        id: deploy
        working-directory: packages/runtime-cloudflare
        run: |
          pnpm wrangler deploy \
            --config test/wrangler-ci.toml \
            --name "$WORKER_NAME" \
            --keep-vars 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not parse deployed URL from wrangler output"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Smoke — fetch root endpoint
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            RESPONSE=$(curl -sS -w "\n%{http_code}" --max-time 10 "$URL/" || true)
            BODY=$(echo "$RESPONSE" | head -n -1)
            CODE=$(echo "$RESPONSE" | tail -n 1)
            if [ "$CODE" = "200" ]; then
              echo "Smoke OK (attempt $i): body=$BODY"
              echo "$BODY" | jq -e '.runtime == "meridian-cloudflare" and .milestone == "m1-walking-skeleton"'
              break
            fi
            echo "Attempt $i: HTTP $CODE; retrying in 5s..."
            sleep 5
            if [ "$i" = "6" ]; then
              echo "::error::Smoke check failed after 6 attempts"
              exit 1
            fi
          done

      - name: Conformance — run runtime scenarios against live deploy
        working-directory: packages/runtime-cloudflare
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          # Start `wrangler tail` in the background so DO-side console
          # output (logs + exception stacks) lands in the workflow log
          # for any failing batch. `wrangler tail` takes the worker
          # name as a positional, not a flag. Output to a file so we
          # can print it AFTER all batches run.
          pnpm wrangler tail "$WORKER_NAME" --format json > tail.log 2>&1 &
          TAIL_PID=$!
          sleep 3

          # Batched conformance: each /conformance?offset=N&limit=M
          # Worker invocation runs a subset of the suite. Keeps each
          # invocation well under the ~30s Worker CPU budget. Page size
          # 8 is comfortably safe for the longest-running scenarios
          # (errors-codes-reachable does ~26 DO RPCs).
          PAGE_SIZE=8

          # Metadata curl with retries. First /conformance invocation
          # after deploy pulls the conformance scenarios import, which
          # has a larger module-init cost than the smoke-checked "/"
          # path. Cold isolates under that load sometimes return
          # `error code: 1042` (CF "worker returned invalid response"
          # — a startup timeout / cold-start transient). Retry a few
          # times before declaring a real fault.
          META_FILE=conf-meta.json
          TOTAL=""
          for attempt in 1 2 3 4 5 6; do
            curl -sS --max-time 30 -o "$META_FILE" \
              "$URL/conformance?offset=0&limit=0" || true
            if TOTAL=$(jq -er '.total' "$META_FILE" 2>/dev/null); then
              break
            fi
            echo "Metadata attempt $attempt: non-JSON response; retrying in 5s..."
            sleep 5
          done
          if [ -z "$TOTAL" ]; then
            echo "::error::Metadata curl failed after 6 attempts"
            echo "::group::Last metadata response body"
            cat "$META_FILE" | head -40 || echo "(file empty)"
            echo "::endgroup::"
            exit 1
          fi
          echo "Scenario total: $TOTAL (paging by $PAGE_SIZE)"

          TOTAL_PASSED=0
          TOTAL_FAILED=0
          TOTAL_SKIPPED=0
          ALL_FAILURES="[]"

          OFFSET=0
          while [ "$OFFSET" -lt "$TOTAL" ]; do
            echo "--- Batch offset=$OFFSET limit=$PAGE_SIZE ---"
            RESPONSE=$(curl -sS -w "\n%{http_code}" --max-time 60 \
              "$URL/conformance?offset=$OFFSET&limit=$PAGE_SIZE" || true)
            BODY=$(echo "$RESPONSE" | head -n -1)
            CODE=$(echo "$RESPONSE" | tail -n 1)
            echo "HTTP $CODE"

            # Parse; on non-JSON (CF error page) print raw body and
            # surface a clear error.
            if ! echo "$BODY" | jq -e '.summary' >/dev/null 2>&1; then
              echo "::group::Non-JSON response body"
              echo "$BODY" | head -40
              echo "::endgroup::"
              echo "::error::Batch at offset=$OFFSET returned non-JSON (HTTP $CODE)"
              OFFSET=$((OFFSET + PAGE_SIZE))
              TOTAL_FAILED=$((TOTAL_FAILED + 1))
              continue
            fi

            BATCH_PASSED=$(echo "$BODY" | jq -r '.summary.passed')
            BATCH_FAILED=$(echo "$BODY" | jq -r '.summary.failed')
            BATCH_SKIPPED=$(echo "$BODY" | jq -r '.summary.skipped')
            echo "batch summary: passed=$BATCH_PASSED failed=$BATCH_FAILED skipped=$BATCH_SKIPPED"

            TOTAL_PASSED=$((TOTAL_PASSED + BATCH_PASSED))
            TOTAL_FAILED=$((TOTAL_FAILED + BATCH_FAILED))
            TOTAL_SKIPPED=$((TOTAL_SKIPPED + BATCH_SKIPPED))

            if [ "$BATCH_FAILED" -gt 0 ]; then
              BATCH_FAILURES=$(echo "$BODY" | jq '.results | map(select(.status == "failed"))')
              ALL_FAILURES=$(echo "$ALL_FAILURES $BATCH_FAILURES" | jq -s 'add')
            fi

            OFFSET=$((OFFSET + PAGE_SIZE))
          done

          # Stop tail; give it a moment to flush.
          sleep 2
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true

          echo "=== Conformance summary ==="
          echo "passed=$TOTAL_PASSED failed=$TOTAL_FAILED skipped=$TOTAL_SKIPPED total=$TOTAL"

          if [ "$TOTAL_FAILED" -gt 0 ]; then
            echo "::group::Failed scenarios"
            echo "$ALL_FAILURES" | jq .
            echo "::endgroup::"
            echo "::group::Worker tail output (DO-side exception stacks)"
            jq -c 'select(.exceptions | length > 0) | {
              event: .event,
              exceptions: (.exceptions | map({name, message, stack}))
            }' tail.log 2>/dev/null | head -40
            if [ ! -s tail.log ]; then
              echo "(tail.log is empty — check wrangler tail startup errors below)"
            fi
            echo "::endgroup::"
            echo "::group::wrangler tail stderr (diagnostics)"
            grep -i "error\|unknown" tail.log | head -20 || true
            echo "::endgroup::"
            echo "::error::Real-CF conformance failed: $TOTAL_FAILED of $TOTAL scenarios"
            exit 1
          fi
          if [ "$TOTAL_PASSED" -eq 0 ]; then
            echo "::error::No scenarios passed — workflow assertion failed"
            exit 1
          fi

      - name: Upload tail.log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-tail-log
          path: packages/runtime-cloudflare/tail.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Teardown — delete CI worker
        # Only runs on success. On failure we leave the worker deployed
        # so its Workers Logs stay inspectable via the Cloudflare
        # dashboard (dashboard logs die with the worker). Manual
        # teardown after investigation: `wrangler delete --name
        # meridian-runtime-cloudflare-ci --force`. The next real-CF
        # run redeploys over it regardless.
        if: success()
        working-directory: packages/runtime-cloudflare
        run: |
          pnpm wrangler delete \
            --name "$WORKER_NAME" \
            --force \
            || echo "::warning::Teardown failed or worker did not exist"
